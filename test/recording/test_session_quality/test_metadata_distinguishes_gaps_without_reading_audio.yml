limitations:
- One recording document only; continuation documents are not followed.
- Frame ranges are half-open on the named source timebase; independent clocks are
  not aligned.
- Unmapped audio has asset positions only; journal intervals do not locate its samples.
- Metadata is evidence, not verified media integrity. Use recs record check for full
  verification.
- Optional analysis measures a prefix of each fragment. Peak and RMS are normalized
  linear amplitudes (1 = full scale).
- Run ranges stop at fragment/analysis boundaries; they do not establish where unexamined
  audio stops being near full scale.
- Near-full-scale runs are advisories, not proof of clipping; low signal levels receive
  no verdict.
